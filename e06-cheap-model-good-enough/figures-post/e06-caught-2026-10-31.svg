<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 422" width="480" height="506" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="400" height="422" fill="#FCFBF9"/><text x="14.0" y="34.0" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Asking three times caught the</text><text x="14.0" y="59.0" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">mistakes the check missed</text><text x="14.0" y="82.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">Wrong first answers from the four cheap models,</text><text x="14.0" y="103.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">81 held-out tasks each: 20 in total</text><text x="14.0" y="137.0" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Code check: caught 1 of 20</text><rect x="14.0" y="146.0" width="372.0" height="34.0" rx="6" fill="#E3D9D4" stroke="none" stroke-width="1.5"/><rect x="14.0" y="146.0" width="18.6" height="34.0" rx="6" fill="#2D6B45" stroke="none" stroke-width="1.5"/><rect x="26.6" y="146.0" width="6.0" height="34.0" rx="0" fill="#2D6B45" stroke="none" stroke-width="1.5"/><text x="376.0" y="169.0" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="end">missed 19</text><text x="14.0" y="200.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">The one it caught had run out of room before it</text><text x="14.0" y="221.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">gave any answer.</text><text x="14.0" y="257.0" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Asking three times: caught 13 of 20</text><rect x="14.0" y="266.0" width="372.0" height="34.0" rx="6" fill="#E3D9D4" stroke="none" stroke-width="1.5"/><rect x="14.0" y="266.0" width="241.8" height="34.0" rx="6" fill="#2D6B45" stroke="none" stroke-width="1.5"/><rect x="249.8" y="266.0" width="6.0" height="34.0" rx="0" fill="#2D6B45" stroke="none" stroke-width="1.5"/><text x="24.0" y="289.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">caught 13</text><text x="376.0" y="289.0" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="end">missed 7</text><text x="14.0" y="320.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">It missed 7 where all three answers agreed on the</text><text x="14.0" y="341.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">same wrong answer. It also sent 19 right answers</text><text x="14.0" y="362.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">to Sol, which costs money.</text><line x1="14" y1="383" x2="386" y2="383" stroke="#D9D6CF"/><text x="14.0" y="403.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">Each model’s first answer only. Run of 29 Oct.</text></svg>