<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 457" width="480" height="548" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="400" height="457" fill="#FCFBF9"/><text x="14.0" y="34.0" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">Sol’s accuracy for about a quarter of</text><text x="14.0" y="59.0" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">the price</text><text x="14.0" y="82.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">gpt-oss-20b on 81 held-out tasks. Bars show cost</text><text x="14.0" y="103.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">per 1,000 tasks.</text><text x="14.0" y="138.0" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">gpt-oss-20b alone</text><text x="386.0" y="138.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="end">91.8% right</text><rect x="14.0" y="146.0" width="14.3" height="24.0" rx="5" fill="#E3D9D4" stroke="none" stroke-width="1.5"/><text x="36.3" y="163.0" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">$0.07</text><text x="14.0" y="202.0" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">+ code check</text><text x="386.0" y="202.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="end">91.8% right</text><rect x="14.0" y="210.0" width="14.3" height="24.0" rx="5" fill="#E3D9D4" stroke="none" stroke-width="1.5"/><text x="36.3" y="227.0" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">$0.07</text><text x="14.0" y="266.0" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">+ asking three times</text><text x="386.0" y="266.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="end">97.5% right</text><rect x="14.0" y="274.0" width="84.0" height="24.0" rx="5" fill="#2D6B45" stroke="none" stroke-width="1.5"/><text x="106.0" y="291.0" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">$0.40</text><text x="14.0" y="330.0" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Sol alone</text><text x="386.0" y="330.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="end">97.5% right</text><rect x="14.0" y="338.0" width="314.0" height="24.0" rx="5" fill="#8F5A0E" stroke="none" stroke-width="1.5"/><text x="336.0" y="355.0" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="start">$1.51</text><line x1="14" y1="376" x2="386" y2="376" stroke="#D9D6CF"/><text x="14.0" y="396.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">With three answers, the other cheap models</text><text x="14.0" y="417.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">scored 95–99% at $0.41–$0.62. List prices; run of</text><text x="14.0" y="438.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">29 Oct.</text></svg>