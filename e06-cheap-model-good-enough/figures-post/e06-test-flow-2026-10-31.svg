<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 611" width="480" height="733" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><rect width="400" height="611" fill="#FCFBF9"/><text x="14.0" y="34.0" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">How each answer was tested</text><text x="14.0" y="57.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">Three tasks: invoices, tool calls, refund amounts.</text><rect x="14" y="74.0" width="372" height="64.0" rx="8" fill="#F1EFEA" stroke="#D9D6CF" stroke-width="1.5"/><text x="26.0" y="100.0" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">81 tasks, each with one right answer written</text><text x="26.0" y="121.0" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">down before any model saw it</text><line x1="200.0" y1="140" x2="200.0" y2="155" stroke="#4A5160" stroke-width="1.6"/><path d="M195.0,154 L200.0,162 L205.0,154 Z" fill="#4A5160"/><rect x="14" y="164.0" width="372" height="64.0" rx="8" fill="#F1EFEA" stroke="#D9D6CF" stroke-width="1.5"/><text x="26.0" y="190.0" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">A cheap model answers each task three times.</text><text x="26.0" y="211.0" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">Sol, the expensive model, answers once.</text><line x1="200.0" y1="230" x2="200.0" y2="245" stroke="#4A5160" stroke-width="1.6"/><path d="M195.0,244 L200.0,252 L205.0,244 Z" fill="#4A5160"/><text x="14.0" y="270.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">Then one of two rules decides whether to keep</text><text x="14.0" y="291.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">the cheap answer:</text><rect x="14" y="304.0" width="372" height="107.0" rx="8" fill="#F1EFEA" stroke="#D9D6CF" stroke-width="1.5"/><text x="26.0" y="331.0" font-size="16" font-weight="700" fill="#1A1D24" text-anchor="start">Route 1: the code check</text><text x="26.0" y="352.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">Keep the cheap answer if the JSON parses,</text><text x="26.0" y="373.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">the totals add up and the tool and its</text><text x="26.0" y="394.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">arguments exist. If not, use Sol’s answer.</text><rect x="14" y="421.0" width="372" height="86.0" rx="8" fill="#E7F2EA" stroke="#2D6B45" stroke-width="1.5"/><text x="26.0" y="448.0" font-size="16" font-weight="700" fill="#2D6B45" text-anchor="start">Route 2: asking three times</text><text x="26.0" y="469.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">Keep the cheap answer if all three answers</text><text x="26.0" y="490.0" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">match. If they differ, use Sol’s answer.</text><line x1="200.0" y1="509" x2="200.0" y2="524" stroke="#4A5160" stroke-width="1.6"/><path d="M195.0,523 L200.0,531 L205.0,523 Z" fill="#4A5160"/><rect x="14" y="533.0" width="372" height="64.0" rx="8" fill="#F1EFEA" stroke="#D9D6CF" stroke-width="1.5"/><text x="26.0" y="559.0" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">Code marks every final answer against the</text><text x="26.0" y="580.0" font-size="15" font-weight="400" fill="#1A1D24" text-anchor="start">written one. No AI judge.</text></svg>