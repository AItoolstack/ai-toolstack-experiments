<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="480" height="672" role="img" aria-label="Two rules decide whether to keep a cheap model answer or use Sol" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4A5160"/></marker></defs><rect width="400" height="560" fill="#FCFBF9"/><text x="14" y="30" font-size="19" font-weight="700" fill="#1A1D24" text-anchor="start">How each answer was tested</text><rect x="100" y="50" width="200" height="40" rx="8" fill="#F1EFEA" stroke="#D9D6CF" stroke-width="1.5"/><text x="200" y="76" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">Task + written answer</text><line x1="200" y1="90" x2="200" y2="112" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><rect x="60" y="114" width="280" height="74" rx="8" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.5"/><text x="200" y="138" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">Cheap model, asked 3 times</text><rect x="76" y="150" width="72" height="28" rx="6" fill="#F1EFEA" stroke="#D9D6CF" stroke-width="1.2"/><text x="112" y="169" font-size="15" font-weight="400" fill="#4A5160" text-anchor="middle">answer 1</text><rect x="164" y="150" width="72" height="28" rx="6" fill="#F1EFEA" stroke="#D9D6CF" stroke-width="1.2"/><text x="200" y="169" font-size="15" font-weight="400" fill="#4A5160" text-anchor="middle">answer 2</text><rect x="252" y="150" width="72" height="28" rx="6" fill="#F1EFEA" stroke="#D9D6CF" stroke-width="1.2"/><text x="288" y="169" font-size="15" font-weight="400" fill="#4A5160" text-anchor="middle">answer 3</text><line x1="112" y1="188" x2="102" y2="226" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><line x1="288" y1="188" x2="298" y2="226" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><rect x="14" y="228" width="176" height="62" rx="8" fill="#F1EFEA" stroke="#4A5160" stroke-width="1.5"/><text x="102" y="253" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">Rule 1: code check</text><text x="102" y="275" font-size="15" font-weight="400" fill="#4A5160" text-anchor="middle">Answer 1 well formed?</text><rect x="210" y="228" width="176" height="62" rx="8" fill="#E7F2EA" stroke="#2D6B45" stroke-width="2"/><text x="298" y="253" font-size="15" font-weight="700" fill="#2D6B45" text-anchor="middle">Rule 2: agreement</text><text x="298" y="275" font-size="15" font-weight="400" fill="#4A5160" text-anchor="middle">All 3 the same?</text><rect x="14" y="370" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.5"/><text x="69" y="393" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">Keep</text><text x="69" y="412" font-size="15" font-weight="400" fill="#4A5160" text-anchor="middle">answer 1</text><rect x="276" y="370" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.5"/><text x="331" y="393" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">Keep</text><text x="331" y="412" font-size="15" font-weight="400" fill="#4A5160" text-anchor="middle">answer 1</text><rect x="140" y="370" width="120" height="52" rx="8" fill="#FAEEDD" stroke="#8F5A0E" stroke-width="1.5"/><text x="200" y="393" font-size="15" font-weight="700" fill="#8F5A0E" text-anchor="middle">Use Sol</text><text x="200" y="412" font-size="15" font-weight="400" fill="#4A5160" text-anchor="middle">(expensive)</text><line x1="60" y1="290" x2="60" y2="366" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><text x="40.0" y="328.0" font-size="15" font-weight="700" fill="#4A5160" text-anchor="middle">yes</text><line x1="150" y1="290" x2="176" y2="366" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><text x="181.0" y="326.0" font-size="15" font-weight="700" fill="#4A5160" text-anchor="middle">no</text><line x1="340" y1="290" x2="340" y2="366" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><text x="360.0" y="328.0" font-size="15" font-weight="700" fill="#4A5160" text-anchor="middle">yes</text><line x1="250" y1="290" x2="224" y2="366" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><text x="219.0" y="326.0" font-size="15" font-weight="700" fill="#4A5160" text-anchor="middle">no</text><line x1="69" y1="422" x2="154.15" y2="470" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><line x1="200" y1="422" x2="200.0" y2="470" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><line x1="331" y1="422" x2="245.85" y2="470" stroke="#4A5160" stroke-width="1.6" marker-end="url(#ah)"/><rect x="80" y="472" width="240" height="44" rx="8" fill="#FCFBF9" stroke="#1A1D24" stroke-width="1.6"/><text x="200" y="499" font-size="15" font-weight="700" fill="#1A1D24" text-anchor="middle">Marked by code. No AI judge.</text><text x="14" y="546" font-size="15" font-weight="400" fill="#4A5160" text-anchor="start">Both rules ran on the same saved answers.</text></svg>