<svg viewBox="0 0 680 470" width="100%" role="img" aria-label="Diagram: an item goes to an AI judge, which gives a mark. 30 items, 13 runs, 4 judges." xmlns="http://www.w3.org/2000/svg" style="font-family:var(--font-sans,Geist,ui-sans-serif,system-ui,sans-serif);max-width:680px;height:auto;display:block;margin:0 auto"><title>Diagram: an item goes to an AI judge, which gives a mark. 30 items, 13 runs, 4 judges.</title><rect width="680" height="470" fill="var(--card-bg,#FCFBF9)" rx="12"/><text x="24" y="40" font-size="21" fill="var(--ink,#1A1D24)" font-weight="700" text-anchor="start">One check, start to finish</text><rect x="24" y="62" width="196" height="170" rx="10" fill="var(--doc,#E8EFFA)"/><text x="40" y="94" font-size="19" fill="var(--doc-ink,#2F5FA8)" font-weight="700" text-anchor="start">1. An item</text><text x="40" y="124" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">a document</text><text x="40" y="148" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">+ an answer to mark</text><text x="40" y="172" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start"></text><text x="40" y="196" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">e.g. a support reply</text><text x="40" y="220" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">and the returns policy</text><rect x="242" y="62" width="196" height="170" rx="10" fill="var(--paper,#F6F5F1)"/><text x="258" y="94" font-size="19" fill="var(--navy,#1F2940)" font-weight="700" text-anchor="start">2. An AI judge</text><text x="258" y="124" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">reads the item and a</text><text x="258" y="148" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">marking guide</text><text x="258" y="172" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start"></text><text x="258" y="196" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">4 judges: gpt-oss (x2),</text><text x="258" y="220" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">Luna, Sol</text><rect x="460" y="62" width="196" height="170" rx="10" fill="var(--build,#E7F2EA)"/><text x="476" y="94" font-size="19" fill="var(--build-ink,#2D6B45)" font-weight="700" text-anchor="start">3. A mark</text><text x="476" y="124" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">PASS or FAIL,</text><text x="476" y="148" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">or a score from 1 to 5,</text><text x="476" y="172" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start"></text><text x="476" y="196" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">plus a one-line</text><text x="476" y="220" font-size="16" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">reason</text><path d="M222 147 l16 0" stroke="var(--dim,#8A909C)" stroke-width="2"/><path d="M238 141 l6 6 l-6 6" fill="none" stroke="var(--dim,#8A909C)" stroke-width="2"/><path d="M440 147 l16 0" stroke="var(--dim,#8A909C)" stroke-width="2"/><path d="M456 141 l6 6 l-6 6" fill="none" stroke="var(--dim,#8A909C)" stroke-width="2"/><text x="24" y="270" font-size="15.5" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">Each judge marked every item 13 times: 30 items × 13 runs × 4 judges = 1,560 marks.</text><text x="24" y="318" font-size="19" fill="var(--ink,#1A1D24)" font-weight="700" text-anchor="start">The 30 items</text><rect x="24" y="336" width="140.8" height="44" rx="6" fill="var(--navy,#1F2940)"/><rect x="166.8" y="336" width="61.19999999999999" height="44" rx="6" fill="var(--amber,#E0A946)"/><text x="34" y="364" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start">7 clear</text><text x="174.8" y="364" font-size="15" fill="var(--ink,#1A1D24)" font-weight="600" text-anchor="start">3</text><text x="24" y="406" font-size="16" fill="var(--ink,#1A1D24)" font-weight="600" text-anchor="start">Document checks</text><text x="24" y="428" font-size="14" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">PASS/FAIL</text><rect x="238" y="336" width="100.0" height="44" rx="6" fill="var(--navy,#1F2940)"/><rect x="340.0" y="336" width="102.0" height="44" rx="6" fill="var(--amber,#E0A946)"/><text x="248" y="364" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start">5 clear</text><text x="348.0" y="364" font-size="15" fill="var(--ink,#1A1D24)" font-weight="600" text-anchor="start">5</text><text x="238" y="406" font-size="16" fill="var(--ink,#1A1D24)" font-weight="600" text-anchor="start">Summary scores</text><text x="238" y="428" font-size="14" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">score 1 to 5</text><rect x="452" y="336" width="120.4" height="44" rx="6" fill="var(--navy,#1F2940)"/><rect x="574.4" y="336" width="81.6" height="44" rx="6" fill="var(--amber,#E0A946)"/><text x="462" y="364" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start">6 clear</text><text x="582.4" y="364" font-size="15" fill="var(--ink,#1A1D24)" font-weight="600" text-anchor="start">4</text><text x="452" y="406" font-size="16" fill="var(--ink,#1A1D24)" font-weight="600" text-anchor="start">Policy checks</text><text x="452" y="428" font-size="14" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">PASS/FAIL</text><rect x="24" y="442" width="14" height="14" rx="3" fill="var(--navy,#1F2940)"/><text x="44" y="454" font-size="14" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">clear right answer</text><rect x="196" y="442" width="14" height="14" rx="3" fill="var(--amber,#E0A946)"/><text x="216" y="454" font-size="14" fill="var(--muted,#4A5160)" font-weight="400" text-anchor="start">borderline on purpose</text></svg>